#script-opts=ytdl_hook-ytdl_path=yt-dlp

# The OSC sizes/positions itself off the video's rendered rect, not the
# window (vidscale=auto, mpv's default) -- when the video ends up smaller
# than the window, the OSC shrinks and blurs right along with it instead
# of hugging the real window edges.
script-opts=osc-vidscale=no

# YouTube: the default (mweb) client hands out googlevideo URLs that ffmpeg
# gets 403 Forbidden on.  yt-dlp itself downloads them fine -- the URLs die
# when they come out of yt-dlp's JSON-dump mode, which is exactly how mpv
# asks for them (`yt-dlp -J`).  The tv_simply client's URLs survive the
# handoff, and it still offers the full adaptive ladder (verified 1440p/4K).
# The android client also works but is capped at 360p, so don't use it.
ytdl-raw-options=extractor-args=youtube:player_client=tv_simply
